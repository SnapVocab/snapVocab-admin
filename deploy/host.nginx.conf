# Initial HTTP vhost. Certbot adds HTTPS and the redirect after DNS is verified.
server {
    listen 80;
    listen [::]:80;
    server_name admin.snapvocab.thanhthbm.online;
    server_tokens off;

    access_log /var/log/nginx/snapvocab-admin.access.log;
    error_log /var/log/nginx/snapvocab-admin.error.log;

    # Same backend as api.snapvocab.thanhthbm.online, reached over loopback.
    location /api/ {
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
